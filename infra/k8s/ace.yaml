# ACE no cluster (P5-4c; sonda honesta: ADR 001). Imagem local, carregada no no com 'kind load'.
# Usa o Secret mq-credenciais (chave 'app') do MQ, e o Service 'mq' como endereco.
# Pre-requisito: ConfigMap ace-sonda, gerado de infra/k8s/sonda/pronto.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ace-config
  namespace: lab
data:
  MQ_HOST: mq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ace
  template:
    metadata:
      labels:
        app: ace
    spec:
      containers:
        - name: ace
          image: integration-lab/ace:12.0.12.27-dev
          imagePullPolicy: Never
          env:
            - name: MQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: ace-config
                  key: MQ_HOST
            - name: MQ_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mq-credenciais
                  key: app
            # o IP ATUAL do pod (muda a cada recriacao): Downward API
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 7600
            - containerPort: 7800
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 768Mi
          # ADR 001: pronto = handle de leitura na APP.IN vindo deste pod. Readiness, nunca liveness.
          readinessProbe:
            exec:
              command: ["/bin/bash", "/sonda/pronto.sh"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - name: sonda
              mountPath: /sonda
      volumes:
        - name: sonda
          configMap:
            name: ace-sonda
