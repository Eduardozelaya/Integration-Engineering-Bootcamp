# Exp P5-3b: MQ com volume VAZIO e ACE ligado SEM o up.sh (sem filas APP.* e sem permissoes).
# Projeto separado ('p53b'): rede, volume e portas proprios; o lab nao e tocado.
# Subir:  docker compose -f infra/exp/p5-3b-ambiente-novo.yml --env-file .env up -d
# Apagar: docker compose -f infra/exp/p5-3b-ambiente-novo.yml --env-file .env down -v
name: p53b
services:
  mqnovo:
    image: icr.io/ibm-messaging/mq@sha256:2cb02e7991ac9fc44d10ba4e353abdc1402ec1667243b74a4574df5f274d7907
    container_name: qm1-novo
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_ADMIN_PASSWORD: ${MQ_ADMIN_PASSWORD}
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD}
    ports:
      - "1416:1414"
      - "9445:9443"
    mem_limit: 1g
    volumes:
      - mqdata-novo:/mnt/mqm
    healthcheck:
      test: ["CMD", "chkmqready"]
      interval: 5s
      retries: 30
      start_period: 20s

  acenovo:
    image: integration-lab/ace:12.0.12.27-dev
    container_name: ace-novo
    environment:
      MQ_HOST: qm1-novo
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD}
    ports:
      - "7602:7600"
    mem_limit: 1g
    depends_on:
      mqnovo:
        condition: service_healthy

volumes:
  mqdata-novo:
