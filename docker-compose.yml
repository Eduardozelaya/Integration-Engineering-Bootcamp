services:
  mq:
    image: icr.io/ibm-messaging/mq@sha256:2cb02e7991ac9fc44d10ba4e353abdc1402ec1667243b74a4574df5f274d7907
    container_name: qm1
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: ${MQ_QMGR_NAME:-QM1}
      MQ_ADMIN_PASSWORD: ${MQ_ADMIN_PASSWORD}
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD}
    ports:
      - "1414:1414"
      - "9443:9443"
    mem_limit: 1g
    volumes:
      - mqdata:/mnt/mqm
    # "pronto", nao so "iniciado": o ACE so liga depois disto passar (P5-3)
    healthcheck:
      test: ["CMD", "chkmqready"]
      interval: 5s
      retries: 30
      start_period: 20s

  mock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3   # fixado em 26/10 (era latest); indice multiplataforma do Docker Hub
    container_name: mock
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "8080:8080"
    mem_limit: 256m
    volumes:
      - ./mock:/home/wiremock

  # ACE em container (P5-1b/P5-3). Imagem local, gerada por scripts/build-ace-image.sh:
  # nao esta em registro publico (licenca de desenvolvedor), por isso fica num profile.
  # Sobe com: docker compose --profile ace up -d ace   (depois do up.sh: filas e permissoes primeiro)
  ace:
    image: integration-lab/ace:12.0.12.27-dev
    container_name: ace
    profiles: ["ace"]
    environment:
      MQ_HOST: qm1
      MQ_APP_PASSWORD: ${MQ_APP_PASSWORD}
    ports:
      - "7601:7600"
      - "7801:7800"
    mem_limit: 1g
    depends_on:
      mq:
        condition: service_healthy

volumes:
  mqdata:
